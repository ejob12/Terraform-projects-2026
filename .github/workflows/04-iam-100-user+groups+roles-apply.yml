name: Terraform - 04-iam-100-user+groups+roles (plan + apply-on-main)

on:
  push:
    paths:
      - '04-iam-100-user+groups+roles/**'
  pull_request:
    paths:
      - '04-iam-100-user+groups+roles/**'
  workflow_dispatch:

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.7'

      # --- Configure AWS credentials: prefer OIDC role, fallback to access keys ---
      - name: Configure AWS credentials (OIDC role)
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure AWS credentials (access keys fallback)
        if: ${{ secrets.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # --- Debugging helpers: confirm credentials are visible and working ---
      - name: Debug: show AWS-related env vars
        run: |
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "GITHUB_REF=$GITHUB_REF"
          env | grep -E 'AWS|AWS_ROLE' || true

      - name: Debug: verify AWS identity (STS)
        run: |
          aws sts get-caller-identity || true

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: "04-iam-100-user+groups+roles"

      - name: Terraform init
        run: terraform init -input=false
        working-directory: "04-iam-100-user+groups+roles"

      - name: Terraform validate
        run: terraform validate
        working-directory: "04-iam-100-user+groups+roles"

      - name: Terraform plan (binary)
        run: terraform plan -out=plan.tfplan
        working-directory: "04-iam-100-user+groups+roles"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: 04-iam-100-plan
          path: "04-iam-100-user+groups+roles/plan.tfplan"

  apply:
    name: Apply (only on main, requires environment approval)
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: apply-04-iam-100-user+groups+roles
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # configure credentials for apply: same preference order
      - name: Configure AWS credentials (OIDC role)
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure AWS credentials (access keys fallback)
        if: ${{ secrets.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Debug: verify AWS identity (STS)
        run: |
          aws sts get-caller-identity || true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.7'

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: 04-iam-100-plan
          path: .

      - name: Terraform init (re-init for apply)
        run: terraform init -input=false
        working-directory: "04-iam-100-user+groups+roles"

      - name: Terraform apply (from saved plan)
        run: terraform apply -input=false "04-iam-100-user+groups+roles/plan.tfplan"