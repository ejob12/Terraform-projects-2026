name: Terraform - 00-compute (plan + apply-on-main)

on:
  push:
    paths:
      - '00-compute/**'
  pull_request:
    paths:
      - '00-compute/**'
  workflow_dispatch:

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.7'

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: 00-compute

      - name: Terraform init
        run: terraform init -input=false
        working-directory: 00-compute

      - name: Terraform validate
        run: terraform validate
        working-directory: 00-compute

      - name: Terraform plan (binary)
        run: terraform plan -out=plan.tfplan
        working-directory: 00-compute

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: 00-compute-plan
          path: 00-compute/plan.tfplan

  apply:
    name: Apply (only on main, requires environment approval)
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: apply-00-compute
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # --- Configure cloud credentials ---
      # Option A (recommended): OIDC role for AWS (replace with your provider and role)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Option B (alternative): use long-lived secrets (not recommended)
      # - name: Configure AWS credentials (secrets)
      #   uses: aws-actions/configure-aws-credentials@v2
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.7'

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: 00-compute-plan
          path: .

      - name: Terraform init (re-init for apply)
        run: terraform init -input=false
        working-directory: 00-compute

      - name: Terraform apply (from saved plan)
        run: terraform apply -input=false 00-compute/plan.tfplan